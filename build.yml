name: Build EXE
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name Enigma2KOS enigma2_kos_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Enigma2KOS
          path: dist/Enigma2KOS.exe
